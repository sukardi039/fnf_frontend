openapi: 3.1.0
info:
  title: Fresh n Freshness API
  version: 1.0.0-draft
  description: Authoritative draft contract for Fresh n Freshness v1.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Catalog
  - name: Inventory
  - name: Checkout
  - name: PDA
  - name: Transformation
  - name: Reporting
paths:
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/pda/exchange:
    post:
      tags: [Authentication]
      security: []
      operationId: exchangePdaChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdaLoginExchangeRequest"
      responses:
        "200":
          description: Staff-scoped PDA session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSessionResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/pda/session/refresh:
    post:
      tags: [Authentication]
      security: []
      operationId: refreshPdaSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PdaSessionRefreshRequest" }
      responses:
        "200":
          description: PDA access token renewed and refresh token rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/pda/session/logout:
    post:
      tags: [Authentication]
      security: []
      operationId: logoutPdaSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PdaSessionRefreshRequest" }
      responses:
        "204": { description: PDA renewable session revoked }
  /pda-devices:
    post:
      tags: [Authentication]
      operationId: registerPdaDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PdaDeviceRegistrationRequest" }
      responses:
        "201":
          description: PDA device registered and bound to staff/store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PdaDeviceResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/customers/register:
    post:
      tags: [Authentication]
      security: []
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRegistrationRequest" }
      responses:
        "201":
          description: Customer account created
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/customers/login:
    post:
      tags: [Authentication]
      security: []
      operationId: loginCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerLoginRequest" }
      responses:
        "200":
          description: Customer authenticated; the renewable session is set in an HttpOnly cookie
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/session/refresh:
    post:
      tags: [Authentication]
      security: []
      operationId: refreshSession
      responses:
        "200":
          description: Access token renewed and refresh token rotated
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/session/logout:
    post:
      tags: [Authentication]
      security: []
      operationId: logoutSession
      responses:
        "204":
          description: Renewable session revoked and cookie cleared
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearedRefreshSessionCookie" }
  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: format, in: query, schema: { $ref: "#/components/schemas/ProductFormat" } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  total: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /uoms:
    get:
      tags: [Catalog]
      operationId: listUoms
      parameters:
        - { name: active, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Approved UOM list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Uom" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Catalog]
      operationId: createUom
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UomRequest" }
      responses:
        "201":
          description: UOM created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Uom" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /uoms/{uomId}:
    put:
      tags: [Catalog]
      operationId: updateUom
      parameters:
        - name: uomId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UomRequest" }
      responses:
        "200":
          description: UOM updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Uom" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /uom-conversions:
    get:
      tags: [Catalog]
      operationId: listUomConversions
      parameters:
        - { name: fromUom, in: query, schema: { type: string } }
        - { name: toUom, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: UOM conversion records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UomConversion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Catalog]
      operationId: createUomConversion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UomConversionRequest" }
      responses:
        "201":
          description: Conversion record created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UomConversion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /price-rules:
    post:
      tags: [Catalog]
      operationId: createPriceRule
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceRuleRequest" }
      responses:
        "201":
          description: Price rule created
          content:
            application/json:
              schema:
                type: object
                required: [ruleId, status]
                properties:
                  ruleId: { $ref: "#/components/schemas/Identifier" }
                  status: { type: string, enum: [DRAFT, ACTIVE] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /price-rules/{ruleId}/publish:
    post:
      tags: [Catalog]
      operationId: publishPriceRule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
      responses:
        "200":
          description: Price rule published after conflict validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceRuleResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /labels:
    post:
      tags: [Catalog]
      operationId: generateSkuLabel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelGenerationRequest" }
      responses:
        "201":
          description: Printable label reference generated for an active SKU
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /labels/{labelRef}:
    get:
      tags: [Catalog]
      security: []
      operationId: resolveSkuLabel
      parameters:
        - name: labelRef
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
      responses:
        "200":
          description: Active product metadata resolved from an opaque label reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
  /labels/{labelRef}/download:
    get:
      tags: [Catalog]
      security: []
      operationId: downloadSkuLabel
      parameters:
        - name: labelRef
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
      responses:
        "200":
          description: Rendered printable label
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
            application/pdf:
              schema: { type: string, contentEncoding: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
  /labels/resolve-qr:
    post:
      tags: [Catalog]
      security: []
      operationId: resolveSignedQr
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              minLength: 1
              description: Compact base64-encoded signed QR payload returned by /labels
          application/json:
            schema:
              $ref: "#/components/schemas/SignedQrResolutionRequest"
      responses:
        "200":
          description: Active product metadata resolved from a backend-signed QR payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /lots/receive:
    post:
      tags: [Inventory]
      operationId: receivePurchaseLot
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LotReceiveRequest" }
      responses:
        "201":
          description: Lot received
          content:
            application/json:
              schema:
                type: object
                required: [lotId, inventoryMovementId, availableQuantity]
                properties:
                  lotId: { $ref: "#/components/schemas/Identifier" }
                  inventoryMovementId: { $ref: "#/components/schemas/Identifier" }
                  availableQuantity: { $ref: "#/components/schemas/Quantity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /loss-events:
    post:
      tags: [Inventory]
      operationId: createLossEvent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LossEventRequest" }
      responses:
        "201":
          description: Loss posted
          content:
            application/json:
              schema:
                type: object
                required: [lossEventId, remainingQuantity]
                properties:
                  lossEventId: { $ref: "#/components/schemas/Identifier" }
                  remainingQuantity: { $ref: "#/components/schemas/Quantity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /inventory/snapshots:
    get:
      tags: [Inventory]
      operationId: listInventorySnapshots
      parameters:
        - name: storeId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
        - name: skuId
          in: query
          schema: { $ref: "#/components/schemas/Identifier" }
        - name: includeLots
          in: query
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Authoritative inventory snapshot by SKU and lot
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventorySnapshot" }
                  total: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /carts:
    post:
      tags: [Checkout]
      operationId: createCart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartCreateRequest" }
      responses:
        "201":
          description: Cart created
          content:
            application/json:
              schema:
                type: object
                required: [cartId, state]
                properties:
                  cartId: { $ref: "#/components/schemas/Identifier" }
                  state: { type: string, const: CART_CREATED }
        "400": { $ref: "#/components/responses/BadRequest" }
  /carts/{cartId}/items:
    post:
      tags: [Checkout]
      operationId: addCartItem
      parameters:
        - $ref: "#/components/parameters/CartId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemRequest" }
      responses:
        "200":
          description: Authoritative cart totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartTotals" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /checkout:
    post:
      tags: [Checkout]
      operationId: checkout
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200":
          description: Checkout initiated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /payments/{transactionId}/webhook:
    post:
      tags: [Checkout]
      security:
        - paymentWebhook: []
      operationId: processPaymentWebhook
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - name: X-Payment-Signature
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: X-Payment-Event-Id
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentWebhookRequest" }
      responses:
        "200":
          description: Provider event accepted or previously processed
          content:
            application/json:
              schema:
                type: object
                required: [transactionId, state, paymentStatus]
                properties:
                  transactionId: { $ref: "#/components/schemas/Identifier" }
                  state: { $ref: "#/components/schemas/TransactionState" }
                  paymentStatus: { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /refunds:
    post:
      tags: [Checkout]
      operationId: requestRefund
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
      responses:
        "201":
          description: Refund request recorded and pending approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /refunds/{refundId}/approve:
    post:
      tags: [Checkout]
      operationId: approveRefund
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundApprovalRequest" }
      responses:
        "200":
          description: Refund approved and provider flow started or completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /pda/scan/resolve:
    post:
      tags: [PDA]
      operationId: resolvePdaScan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PdaScanRequest" }
      responses:
        "200":
          description: Authoritative transaction status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PdaScanResponse" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /transactions/{transactionId}/collection-token:
    post:
      tags: [PDA]
      operationId: issueCollectionToken
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Short-lived collection token for the authenticated transaction owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionTokenResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /pda/transactions/{transactionId}/handover:
    post:
      tags: [PDA]
      operationId: confirmHandover
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandoverRequest" }
      responses:
        "200":
          description: Handover committed or prior idempotent result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoverResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
  /transformation-recipes:
    get:
      tags: [Transformation]
      operationId: listTransformationRecipes
      parameters:
        - { name: active, in: query, schema: { type: boolean, default: true } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/RecipeType" } }
      responses:
        "200":
          description: Active transformation recipes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TransformationRecipeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Transformation]
      operationId: createTransformationRecipe
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransformationRecipeRequest" }
      responses:
        "201":
          description: Versioned transformation recipe created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationRecipeResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /transformation-recipes/{recipeId}/activate:
    post:
      tags: [Transformation]
      operationId: activateTransformationRecipe
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
      responses:
        "200":
          description: Recipe activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationRecipeResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /transformations:
    post:
      tags: [Transformation]
      operationId: createTransformation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransformationRequest" }
      responses:
        "201":
          description: Transformation posted atomically or held for independent approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /transformations/{transformationId}/approve:
    post:
      tags: [Transformation]
      operationId: approveTransformation
      parameters:
        - name: transformationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransformationApprovalRequest" }
      responses:
        "200":
          description: Pending transformation approved and posted atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /reports/daily-summary:
    get:
      tags: [Reporting]
      operationId: getDailySummary
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: storeId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
      responses:
        "200":
          description: Daily operational summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailySummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /reconciliations:
    post:
      tags: [Reporting]
      operationId: submitReconciliation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationRequest" }
      responses:
        "201":
          description: Reconciliation submitted with authoritative expected quantities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /reconciliations/{reconciliationId}/finalize:
    post:
      tags: [Reporting]
      operationId: finalizeReconciliation
      parameters:
        - name: reconciliationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationDecisionRequest" }
      responses:
        "200":
          description: Reconciliation finalized and locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /reconciliations/{reconciliationId}/reopen:
    post:
      tags: [Reporting]
      operationId: reopenReconciliation
      parameters:
        - name: reconciliationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Identifier" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationDecisionRequest" }
      responses:
        "200":
          description: Finalized reconciliation reopened for resubmission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  headers:
    RefreshSessionCookie:
      description: Secure renewable session cookie; HttpOnly, SameSite=Lax, Path=/api/v1/auth/session
      schema:
        type: string
        example: FnF-Refresh-Token=opaque-token; Path=/api/v1/auth/session; HttpOnly; Secure; SameSite=Lax
    ClearedRefreshSessionCookie:
      description: Expired renewable session cookie
      schema:
        type: string
        example: FnF-Refresh-Token=; Path=/api/v1/auth/session; Max-Age=0; HttpOnly; Secure; SameSite=Lax
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    paymentWebhook:
      type: apiKey
      in: header
      name: X-Payment-Signature
  parameters:
    CartId:
      name: cartId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 100
    Money:
      type: number
      minimum: 0
      multipleOf: 0.0001
    Quantity:
      type: number
      minimum: 0
      multipleOf: 0.001
    ProductFormat:
      type: string
      enum: [WHOLE, CUT, JUICE]
    PrincipalType:
      type: string
      enum: [SYSTEM_USER, STAFF, CUSTOMER, TV]
    Channel:
      type: string
      enum: [STORE_SELF_SELECT, STAFF_ASSISTED, MOBILE_ORDER]
    TransactionState:
      type: string
      enum: [CART_CREATED, CHECKOUT_PENDING, PAYMENT_PENDING, PAYMENT_SUCCESS, PAYMENT_FAILED, READY_FOR_HANDOVER, HANDED_OVER, CANCELLED, REFUNDED, EXPIRED]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 200, writeOnly: true }
    PdaLoginExchangeRequest:
      type: object
      additionalProperties: false
      required: [loginKey]
      properties:
        loginKey: { type: string, minLength: 1, maxLength: 128 }
        deviceId:
          oneOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
        storeId:
          oneOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
    CustomerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        mobileNumber: { type: string, maxLength: 30 }
        password: { type: string, minLength: 8, maxLength: 200, writeOnly: true }
    CustomerLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 200, writeOnly: true }
    CustomerSessionResponse:
      type: object
      required: [token, principalType, customerId, name, email]
      properties:
        token: { type: string, writeOnly: true }
        principalType: { type: string, const: CUSTOMER }
        customerId: { $ref: "#/components/schemas/Identifier" }
        name: { type: string }
        email: { type: string, format: email }
    StaffSessionResponse:
      type: object
      required: [token, refreshToken, principalType, staffId, deviceId, companyId, storeId]
      properties:
        token: { type: string, writeOnly: true }
        refreshToken: { type: string, writeOnly: true }
        principalType: { type: string, const: STAFF }
        staffId: { $ref: "#/components/schemas/Identifier" }
        deviceId: { $ref: "#/components/schemas/Identifier" }
        companyId: { $ref: "#/components/schemas/Identifier" }
        storeId: { $ref: "#/components/schemas/Identifier" }
    PdaSessionRefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 32, maxLength: 200, writeOnly: true }
    PdaDeviceRegistrationRequest:
      type: object
      additionalProperties: false
      required: [deviceId, staffId, storeId]
      properties:
        deviceId: { $ref: "#/components/schemas/Identifier" }
        staffId: { $ref: "#/components/schemas/Identifier" }
        storeId: { $ref: "#/components/schemas/Identifier" }
    PdaDeviceResponse:
      type: object
      required: [deviceId, staffId, companyId, storeId, active]
      properties:
        deviceId: { $ref: "#/components/schemas/Identifier" }
        staffId: { $ref: "#/components/schemas/Identifier" }
        companyId: { $ref: "#/components/schemas/Identifier" }
        storeId: { $ref: "#/components/schemas/Identifier" }
        active: { type: boolean }
    LoginResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
        user:
          type: object
          required: [id, name, role, principalType]
          properties:
            id: { $ref: "#/components/schemas/Identifier" }
            name: { type: string }
            role: { type: string }
            principalType: { $ref: "#/components/schemas/PrincipalType" }
    Product:
      type: object
      required: [productId, skuId, productCode, productName, format, uom, price, currency, active]
      properties:
        productId: { $ref: "#/components/schemas/Identifier" }
        skuId: { $ref: "#/components/schemas/Identifier" }
        productCode: { type: string, minLength: 1, maxLength: 100 }
        productName: { type: string, minLength: 1, maxLength: 200 }
        format: { $ref: "#/components/schemas/ProductFormat" }
        uom: { type: string, minLength: 1, maxLength: 20 }
        price: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        active: { type: boolean }
    Uom:
      type: object
      required: [uomId, code, name, precision, active]
      properties:
        uomId: { $ref: "#/components/schemas/Identifier" }
        code: { type: string, minLength: 1, maxLength: 20 }
        name: { type: string, minLength: 1, maxLength: 100 }
        precision: { type: integer, minimum: 0, maximum: 4 }
        active: { type: boolean }
    UomRequest:
      type: object
      additionalProperties: false
      required: [code, name, precision]
      properties:
        code: { type: string, minLength: 1, maxLength: 20 }
        name: { type: string, minLength: 1, maxLength: 100 }
        precision: { type: integer, minimum: 0, maximum: 4 }
        active: { type: boolean, default: true }
    UomConversion:
      type: object
      required: [conversionId, fromUom, toUom, factor, active]
      properties:
        conversionId: { $ref: "#/components/schemas/Identifier" }
        fromUom: { type: string, minLength: 1, maxLength: 20 }
        toUom: { type: string, minLength: 1, maxLength: 20 }
        factor: { type: number, exclusiveMinimum: 0 }
        active: { type: boolean }
    UomConversionRequest:
      type: object
      additionalProperties: false
      required: [fromUom, toUom, factor]
      properties:
        fromUom: { type: string, minLength: 1, maxLength: 20 }
        toUom: { type: string, minLength: 1, maxLength: 20 }
        factor: { type: number, exclusiveMinimum: 0 }
        active: { type: boolean, default: true }
    LabelGenerationRequest:
      type: object
      additionalProperties: false
      required: [skuId, outputFormat]
      properties:
        skuId: { $ref: "#/components/schemas/Identifier" }
        outputFormat: { type: string, enum: [PNG, PDF] }
    LabelResponse:
      type: object
      required: [labelRef, skuId, qrPayload, outputFormat, downloadUrl]
      properties:
        labelRef: { $ref: "#/components/schemas/Identifier" }
        skuId: { $ref: "#/components/schemas/Identifier" }
        qrPayload: { type: string, minLength: 1 }
        outputFormat: { type: string, enum: [PNG, PDF] }
        downloadUrl: { type: string, format: uri-reference }
    SignedQrResolutionRequest:
      type: object
      additionalProperties: false
      required: [qrPayload]
      properties:
        qrPayload: { type: string, minLength: 1, description: Compact base64-encoded signed QR payload }
    PriceRuleRequest:
      type: object
      additionalProperties: false
      required: [ruleName, skuId, discountType, discountValue, startAt, endAt, priority]
      properties:
        ruleName: { type: string, minLength: 1, maxLength: 120 }
        skuId: { $ref: "#/components/schemas/Identifier" }
        discountType: { type: string, enum: [PERCENT, FIXED_AMOUNT] }
        discountValue: { type: number, exclusiveMinimum: 0 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        priority: { type: integer, minimum: 0 }
    PriceRuleResponse:
      type: object
      required: [ruleId, status]
      properties:
        ruleId: { $ref: "#/components/schemas/Identifier" }
        status: { type: string, enum: [DRAFT, ACTIVE] }
    LotReceiveRequest:
      type: object
      additionalProperties: false
      required: [storeId, supplierId, skuId, quantity, uom, totalCost, receivedAt]
      properties:
        storeId: { $ref: "#/components/schemas/Identifier" }
        supplierId: { $ref: "#/components/schemas/Identifier" }
        skuId: { $ref: "#/components/schemas/Identifier" }
        supplierLotRef: { type: string, maxLength: 100 }
        quantity: { type: number, exclusiveMinimum: 0 }
        uom: { type: string }
        totalCost: { $ref: "#/components/schemas/Money" }
        receivedAt: { type: string, format: date-time }
        expiryDate: { type: string, format: date }
    LossEventRequest:
      type: object
      additionalProperties: false
      required: [lotId, skuId, quantity, uom, reasonCode]
      properties:
        lotId: { $ref: "#/components/schemas/Identifier" }
        skuId: { $ref: "#/components/schemas/Identifier" }
        quantity: { type: number, exclusiveMinimum: 0 }
        uom: { type: string }
        reasonCode: { type: string, enum: [SPOILAGE, MISHANDLING, THEFT, OTHER] }
        note: { type: string, maxLength: 500 }
    InventorySnapshot:
      type: object
      required: [snapshotId, storeId, skuId, productName, uom, availableQuantity, reservedQuantity, onHandQuantity, weightedAverageCost]
      properties:
        snapshotId: { $ref: "#/components/schemas/Identifier" }
        storeId: { $ref: "#/components/schemas/Identifier" }
        skuId: { $ref: "#/components/schemas/Identifier" }
        productName: { type: string }
        uom: { type: string }
        availableQuantity: { $ref: "#/components/schemas/Quantity" }
        reservedQuantity: { $ref: "#/components/schemas/Quantity" }
        onHandQuantity: { $ref: "#/components/schemas/Quantity" }
        weightedAverageCost: { $ref: "#/components/schemas/Money" }
        lots:
          type: array
          items: { $ref: "#/components/schemas/InventoryLotSnapshot" }
    InventoryLotSnapshot:
      type: object
      required: [lotId, supplierLotRef, receivedAt, expiryDate, availableQuantity, reservedQuantity, onHandQuantity]
      properties:
        lotId: { $ref: "#/components/schemas/Identifier" }
        supplierLotRef: { type: string }
        receivedAt: { type: string, format: date-time }
        expiryDate:
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        availableQuantity: { $ref: "#/components/schemas/Quantity" }
        reservedQuantity: { $ref: "#/components/schemas/Quantity" }
        onHandQuantity: { $ref: "#/components/schemas/Quantity" }
    CartCreateRequest:
      type: object
      additionalProperties: false
      required: [storeId, channel]
      properties:
        storeId: { $ref: "#/components/schemas/Identifier" }
        channel: { $ref: "#/components/schemas/Channel" }
        customerId:
          oneOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
    CartItemRequest:
      type: object
      additionalProperties: false
      required: [skuId, quantity]
      properties:
        skuId: { $ref: "#/components/schemas/Identifier" }
        quantity: { type: number, exclusiveMinimum: 0 }
    CartTotals:
      type: object
      required: [cartId, quoteId, subtotal, discount, total, currency, expiresAt]
      properties:
        cartId: { $ref: "#/components/schemas/Identifier" }
        quoteId: { $ref: "#/components/schemas/Identifier" }
        subtotal: { $ref: "#/components/schemas/Money" }
        discount: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        expiresAt: { type: string, format: date-time }
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [cartId, quoteId, paymentMode, channel]
      properties:
        cartId: { $ref: "#/components/schemas/Identifier" }
        quoteId: { $ref: "#/components/schemas/Identifier" }
        paymentMode: { type: string, enum: [E_PAYMENT, CASH, PAY_AT_COUNTER] }
        channel: { $ref: "#/components/schemas/Channel" }
    CheckoutResponse:
      type: object
      required: [transactionId, state, amount, currency]
      properties:
        transactionId: { $ref: "#/components/schemas/Identifier" }
        state: { $ref: "#/components/schemas/TransactionState" }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        payment:
          type: object
          properties:
            provider: { type: string }
            redirectUrl: { type: string, format: uri }
    PaymentWebhookRequest:
      type: object
      additionalProperties: false
      required: [providerRef, status, eventId]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 200 }
        providerRef: { type: string }
        status: { type: string, enum: [SUCCESS, FAILED, CANCELLED, REFUNDED] }
        paidAmount: { $ref: "#/components/schemas/Money" }
        paidAt: { type: string, format: date-time }
    RefundRequest:
      type: object
      additionalProperties: false
      required: [transactionId, reason]
      properties:
        transactionId: { $ref: "#/components/schemas/Identifier" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    RefundApprovalRequest:
      type: object
      additionalProperties: false
      required: [approvalNote]
      properties:
        approvalNote: { type: string, minLength: 1, maxLength: 500 }
        returnInspectionRef: { type: string, maxLength: 120 }
    RefundResponse:
      type: object
      required: [refundId, transactionId, paymentId, status, requestedBy, createdAt]
      properties:
        refundId: { $ref: "#/components/schemas/Identifier" }
        transactionId: { $ref: "#/components/schemas/Identifier" }
        paymentId: { $ref: "#/components/schemas/Identifier" }
        status: { type: string, enum: [REQUESTED, APPROVED, PROVIDER_PENDING, COMPLETED, REJECTED] }
        reason: { type: string }
        requestedBy: { $ref: "#/components/schemas/Identifier" }
        approvedBy:
          oneOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
        providerRef:
          oneOf:
            - { type: string }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
    PdaScanRequest:
      type: object
      additionalProperties: false
      required: [qrToken, deviceId]
      properties:
        qrToken: { type: string, minLength: 1, maxLength: 2048 }
        deviceId: { $ref: "#/components/schemas/Identifier" }
    CollectionTokenResponse:
      type: object
      additionalProperties: false
      required: [transactionId, qrToken, expiresAt]
      properties:
        transactionId: { $ref: "#/components/schemas/Identifier" }
        qrToken: { type: string, minLength: 1, maxLength: 2048 }
        expiresAt: { type: string, format: date-time }
    PdaScanResponse:
      type: object
      required: [transactionId, state, paymentStatus, handoverEligible, summary]
      properties:
        transactionId: { $ref: "#/components/schemas/Identifier" }
        state: { $ref: "#/components/schemas/TransactionState" }
        paymentStatus: { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED] }
        handoverEligible: { type: boolean }
        summary:
          type: object
          required: [itemCount, total, currency]
          properties:
            itemCount: { type: integer, minimum: 0 }
            total: { $ref: "#/components/schemas/Money" }
            currency: { type: string, pattern: "^[A-Z]{3}$" }
    HandoverRequest:
      type: object
      additionalProperties: false
      required: [deviceId, staffId]
      properties:
        deviceId: { $ref: "#/components/schemas/Identifier" }
        staffId: { $ref: "#/components/schemas/Identifier" }
    HandoverResponse:
      type: object
      required: [transactionId, state, handoverEventId, handoverAt]
      properties:
        transactionId: { $ref: "#/components/schemas/Identifier" }
        state: { type: string, const: HANDED_OVER }
        handoverEventId: { $ref: "#/components/schemas/Identifier" }
        handoverAt: { type: string, format: date-time }
    TransformationLine:
      type: object
      additionalProperties: false
      required: [skuId, quantity, uom]
      properties:
        lotId: { $ref: "#/components/schemas/Identifier" }
        skuId: { $ref: "#/components/schemas/Identifier" }
        quantity: { type: number, exclusiveMinimum: 0 }
        uom: { type: string }
    TransformationRecipeOutput:
      type: object
      additionalProperties: false
      required: [skuId, allocationWeight, yieldConversionFactor]
      properties:
        skuId: { $ref: "#/components/schemas/Identifier" }
        allocationWeight: { type: number, exclusiveMinimum: 0, maximum: 1 }
        yieldConversionFactor: { type: number, exclusiveMinimum: 0 }
    TransformationRecipeRequest:
      type: object
      additionalProperties: false
      required: [companyId, recipeName, revision, type, inputUom, inputSkuIds, outputs,
        expectedYieldMin, expectedYieldMax, expectedWasteMin, expectedWasteMax]
      properties:
        companyId: { $ref: "#/components/schemas/Identifier" }
        recipeName: { type: string, minLength: 1, maxLength: 200 }
        revision: { type: integer, minimum: 1 }
        type: { type: string, enum: [WHOLE_TO_CUT, WHOLE_TO_JUICE] }
        inputUom: { type: string }
        inputSkuIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/Identifier" }
        outputs:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TransformationRecipeOutput" }
        expectedYieldMin: { type: number, minimum: 0, maximum: 1 }
        expectedYieldMax: { type: number, minimum: 0, maximum: 1 }
        expectedWasteMin: { type: number, minimum: 0, maximum: 1 }
        expectedWasteMax: { type: number, minimum: 0, maximum: 1 }
    TransformationRecipeResponse:
      type: object
      required: [recipeId, recipeName, revision, status]
      properties:
        recipeId: { $ref: "#/components/schemas/Identifier" }
        recipeName: { type: string }
        revision: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
    TransformationRequest:
      type: object
      additionalProperties: false
      required: [recipeId, storeId, inputs, outputs]
      properties:
        recipeId: { $ref: "#/components/schemas/Identifier" }
        storeId: { $ref: "#/components/schemas/Identifier" }
        inputs:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/TransformationLine"
              - required: [lotId]
        outputs:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TransformationLine" }
        note: { type: string, maxLength: 500 }
    TransformationApprovalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    TransformationOutputResult:
      type: object
      required: [skuId, quantity, unitCost]
      properties:
        skuId: { $ref: "#/components/schemas/Identifier" }
        quantity: { type: number, exclusiveMinimum: 0 }
        unitCost: { $ref: "#/components/schemas/Money" }
    TransformationResponse:
      type: object
      required: [transformationId, status, yieldPercent, wasteQuantity, outputs]
      properties:
        transformationId: { $ref: "#/components/schemas/Identifier" }
        status: { type: string, enum: [PENDING_APPROVAL, POSTED] }
        yieldPercent: { type: number, minimum: 0 }
        wasteQuantity: { type: number, minimum: 0 }
        outputs:
          type: array
          items: { $ref: "#/components/schemas/TransformationOutputResult" }
    DailySummary:
      type: object
      required: [date, storeId, grossSales, netSales, shrinkageCost, recoverySales, inventoryValue,
        reconciliationVarianceCost, paymentSuccessRate]
      properties:
        date: { type: string, format: date }
        storeId: { $ref: "#/components/schemas/Identifier" }
        grossSales: { $ref: "#/components/schemas/Money" }
        netSales: { $ref: "#/components/schemas/Money" }
        shrinkageCost: { $ref: "#/components/schemas/Money" }
        recoverySales: { $ref: "#/components/schemas/Money" }
        inventoryValue: { $ref: "#/components/schemas/Money" }
        reconciliationVarianceCost: { $ref: "#/components/schemas/Money" }
        paymentSuccessRate: { type: number, minimum: 0, maximum: 1 }
    ReconciliationLineRequest:
      type: object
      additionalProperties: false
      required: [skuId, countedQuantity]
      properties:
        skuId: { $ref: "#/components/schemas/Identifier" }
        countedQuantity: { type: number, minimum: 0 }
        note: { type: string, maxLength: 500 }
    ReconciliationRequest:
      type: object
      additionalProperties: false
      required: [storeId, businessDate, lines]
      properties:
        storeId: { $ref: "#/components/schemas/Identifier" }
        businessDate: { type: string, format: date }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReconciliationLineRequest" }
    ReconciliationDecisionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ReconciliationLineResponse:
      type: object
      required: [skuId, expectedQuantity, countedQuantity, varianceQuantity]
      properties:
        skuId: { $ref: "#/components/schemas/Identifier" }
        expectedQuantity: { type: number }
        countedQuantity: { type: number }
        varianceQuantity: { type: number }
        note:
          oneOf:
            - { type: string }
            - { type: "null" }
    ReconciliationResponse:
      type: object
      required: [reconciliationId, storeId, businessDate, status, lines]
      properties:
        reconciliationId: { $ref: "#/components/schemas/Identifier" }
        storeId: { $ref: "#/components/schemas/Identifier" }
        businessDate: { type: string, format: date }
        status: { type: string, enum: [SUBMITTED, FINALIZED, REOPENED] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReconciliationLineResponse" }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    Error:
      type: object
      required: [errorCode, message, status, traceId]
      properties:
        errorCode: { type: string }
        message: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        traceId: { type: string }
        fieldErrors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        details: { type: object, additionalProperties: true }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication required or expired
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Permission denied
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Business state conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Gone:
      description: Resource or token expired
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unprocessable:
      description: Domain validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: Dependency unavailable
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
